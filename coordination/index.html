<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coordena&ccedil;&atilde;o | Painel de Programa&ccedil;&atilde;o</title>
    <meta name="description" content="Entrada de informa&ccedil;&otilde;es do Painel de Programa&ccedil;&atilde;o" />
    <link rel="stylesheet" href="../styles.css?v=84" />
  </head>
  <body>
    <main class="coordination-shell">
      <header class="coordination-header">
        <img class="brand-mark" src="../assets/PLIMPLIM.png" alt="" aria-hidden="true" />
        <div>
          <p class="eyebrow">Painel de Programa&ccedil;&atilde;o</p>
          <h1>PREVIS&Atilde;O DE PROGRAMAS</h1>
        </div>
        <div class="coordination-header-actions">
          <button type="button" class="primary-button" id="import-exhibition">Conectar Maestro</button>
          <input type="file" id="exhibition-file" accept=".csv,text/csv" hidden />
          <a class="ghost-link action-icon-button view-panel-button" href="../index.html" title="Ver painel" aria-label="Ver painel"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></a>
        </div>
      </header>

<p id="exhibition-status" role="status" aria-live="polite"></p>

      <form id="coordination-form" class="input-panel">
        <fieldset class="program-card" aria-label="Informações do programa">

          <label>
            <span>PROGRAMA</span>
            <select name="program">
              <option value="">Selecione</option>
              <option value="BOM DIA DF">BOM DIA DF</option>
              <option value="DF1">DF1</option>
              <option value="GLOBO ESPORTE">GLOBO ESPORTE</option>
              <option value="DF2">DF2</option>
              <option value="GLOBO COMUNIDADE">GLOBO COMUNIDADE</option>
            </select>
          </label>

          <label>
            <span>DATA</span>
            <input name="date" type="date" />
          </label>

          <label>
            <span>HOR&Aacute;RIO</span>
            <input name="time" type="time" step="1" />
          </label>

          <label>
            <span>PRODU&Ccedil;&Atilde;O</span>
            <input name="production" type="time" step="1" />
          </label>

          <label class="blocks-count-field">
            <span>BLOCOS</span>
            <select name="blocks">
              <option value="">Selecione</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </label>

          <label class="intervals-count-field">
            <span>INTERVALOS</span>
            <input name="intervals" type="number" min="0" step="1" />
          </label>

          <div class="community-block-fields is-hidden">
            <label>
              <span>BLOCO 1</span>
              <input name="block1" type="text" placeholder="ID DO BLOCO 1" />
            </label>
            <label>
              <span>BLOCO 2</span>
              <input name="block2" type="text" placeholder="ID DO BLOCO 2" />
            </label>
          </div>

          <section class="calls-section wide-field" aria-label="Chamadas">
            <div class="section-title">
              <span>CHAMADAS</span>
              <button class="secondary-button compact-button add-button" type="button" id="add-call" aria-label="Criar mais chamada">+</button>
            </div>
            <div id="calls-list" class="calls-list"></div>
          </section>

          <section class="bulletin-section wide-field" aria-label="Boletim">
            <div class="section-title">
              <span id="bulletin-title">BOLETIM</span>
            </div>
            <div class="bulletin-row">
              <label>
                <span>ID</span>
                <input data-bulletin-field="id" placeholder="ID DO BOLETIM" />
              </label>
              <label>
                <span>NOME</span>
                <input data-bulletin-field="name" placeholder="NOME DO BOLETIM" />
              </label>
              <label>
                <span>DURA&Ccedil;&Atilde;O</span>
                <input data-bulletin-field="duration" type="time" step="1" />
              </label>
              <label>
                <span>HOR&Aacute;RIO</span>
                <input data-bulletin-field="time" type="time" step="1" />
              </label>
            </div>
          </section>

          <section class="wide-field notes-editor-field" aria-label="Observa&ccedil;&otilde;es">
            <span>OBSERVA&Ccedil;&Otilde;ES</span>
            <div class="notes-toolbar" aria-label="Formata&ccedil;&atilde;o das observa&ccedil;&otilde;es">
              <button type="button" data-notes-command="bold" aria-label="Negrito">B</button>
              <button type="button" data-notes-color="#5d6a72" aria-label="Cinza" style="--swatch-color: #5d6a72"></button>
              <button type="button" data-notes-color="#007ed6" aria-label="Azul" style="--swatch-color: #007ed6"></button>
              <button type="button" data-notes-color="#ff7a00" aria-label="Laranja" style="--swatch-color: #ff7a00"></button>
              <button type="button" data-notes-color="#d71964" aria-label="Rosa" style="--swatch-color: #d71964"></button>
            </div>
            <div id="notes-editor" class="notes-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Observa&ccedil;&otilde;es para o painel"></div>
            <textarea name="notes" rows="5" hidden></textarea>
            <input name="notesRich" type="hidden" />
          </section>

        </fieldset>

        <div class="actions">
          <button class="primary-button generate-image-button action-icon-button" type="button" id="generate-image" title="Gerar imagem" aria-label="Gerar imagem"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button>
          <button class="secondary-button action-icon-button" type="button" id="clear-panel" title="Limpar painel" aria-label="Limpar painel"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m15 3 6 6a2 2 0 0 1 0 3l-8 8H7l-4-4a2 2 0 0 1 0-3L12 3a2 2 0 0 1 3 0Z"/><path d="m7 9 8 8M13 20h8"/></svg></button>
          <button class="primary-button action-icon-button" type="submit" title="Enviar previsão" aria-label="Enviar previsão"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
          <div class="update-status-group">
            
            <div class="update-status" aria-live="polite">
              <span class="status-label">&Uacute;ltima atualiza&ccedil;&atilde;o</span>
              <strong id="last-update">Ainda n&atilde;o salvo</strong>
            </div>
          </div>
        </div>
        <p class="image-generation-status" id="image-generation-status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <template id="call-template">
      <div class="call-row">
        <label>
          <span>ID</span>
          <input data-call-field="id" placeholder="ID DA CHAMADA" />
        </label>
        <label>
          <span>NOME</span>
          <input data-call-field="name" placeholder="NOME DA CHAMADA" />
        </label>
        <label>
          <span>DURA&Ccedil;&Atilde;O</span>
          <input data-call-field="duration" type="time" step="1" />
        </label>
        <label>
          <span>HOR&Aacute;RIO</span>
          <input data-call-field="time" type="time" step="1" />
        </label>
        <button class="secondary-button icon-button" type="button" data-remove-call aria-label="Remover chamada">X</button>
      </div>
    </template>

    <script src="../config.js?v=32"></script>
    <script src="../exhibition-import.js?v=5"></script>
    <script src="../app.js?v=75"></script>
  </body>
</html>
